<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bautizo - Jerónimo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eef3f7;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* --- CONTENEDOR DEL SOBRE --- */
        .envelope-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(238, 243, 247, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background: #d4e2ed;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.03);
        }

        /* Solapa superior */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #b7cbdc;
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 3;
        }

        /* Texto de instrucción */
        .envelope-text {
            position: absolute;
            bottom: 35px;
            width: 100%;
            text-align: center;
            color: #4a6881;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 4;
            pointer-events: none;
        }

        /* Animación al hacer clic */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease 0.6s, visibility 0.8s ease 0.6s;
        }

        /* --- TARJETA DE LA INVITACIÓN --- */
        .invitation-card {
            position: relative;
            max-width: 480px;
            width: 100%;
            margin: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CONTADOR SOBREPUESTO --- */
        .countdown-overlay {
            position: absolute;
            bottom: 43%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 10px;
            z-index: 10;
        }

        .time-box {
            background: rgba(224, 237, 245, 0.92);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            width: 62px;
            padding: 6px 0;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        .number {
            display: block;
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c4a63;
        }

        .label {
            font-size: 0.62rem;
            text-transform: uppercase;
            color: #937b42;
            font-weight: 600;
            margin-top: 1px;
            display: block;
        }

        @media (max-width: 420px) {
            .envelope { width: 280px; height: 190px; }
            .flap { border-left-width: 140px; border-right-width: 140px; border-top-width: 105px; }
            .time-box { width: 52px; padding: 5px 0; }
            .number { font-size: 1.1rem; }
            .label { font-size: 0.58rem; }
        }
    </style>
</head>
<body>

    <!-- CAPA DEL SOBRE -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope">
            <div class="flap"></div>
            <div class="envelope-text">✉️ Toca para abrir</div>
        </div>
    </div>

    <!-- TARJETA CON IMAGEN Y CONTADOR -->
    <div class="invitation-card">
        <img src="Invitación Vertical Bautizo Floral Azul y Dorado.png" alt="Invitación Bautizo" class="bg-image">
        
        <div class="countdown-overlay" id="countdown">
            <div class="time-box"><span class="number">--</span><span class="label">Días</span></div>
            <div class="time-box"><span class="number">--</span><span class="label">Hrs</span></div>
            <div class="time-box"><span class="number">--</span><span class="label">Min</span></div>
            <div class="time-box"><span class="number">--</span><span class="label">Seg</span></div>
        </div>
    </div>

    <script>
        // Abrir el sobre al hacer clic en cualquier parte de la pantalla/sobre
        const wrapper = document.getElementById('envelopeWrapper');
        wrapper.addEventListener('click', function() {
            wrapper.classList.add('open');
        });

        // Lógica del contador para el 19 de Diciembre de 2026
        const fechaEvento = new Date("2026-12-19T12:00:00").getTime();

        const x = setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaEvento - ahora;

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            const countdownEl = document.getElementById("countdown");

            if (distancia > 0) {
                countdownEl.innerHTML = `
                    <div class="time-box"><span class="number">${dias}</span><span class="label">Días</span></div>
                    <div class="time-box"><span class="number">${horas}</span><span class="label">Hrs</span></div>
                    <div class="time-box"><span class="number">${minutos}</span><span class="label">Min</span></div>
                    <div class="time-box"><span class="number">${segundos}</span><span class="label">Seg</span></div>
                `;
            } else {
                clearInterval(x);
                countdownEl.innerHTML = `
                    <div class="time-box" style="width: auto; padding: 10px 20px;">
                        <span class="number" style="font-size: 1.1rem;">¡Es Hoy!</span>
                    </div>
                `;
            }
        }, 1000);
    </script>
</body>
</html>
